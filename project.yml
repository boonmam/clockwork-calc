name: Clockwork Calc
options:
  bundleIdPrefix: com.boonmam
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 27
targets:
  ClockworkCalc:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources]
      - path: App/Resources/CAS
        type: folder
        buildPhase: resources
      - path: App/Resources/Math
        type: folder
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: BW8AVKUHR6
        PRODUCT_BUNDLE_IDENTIFIER: com.boonmam.clockworkcalc.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clockwork Calc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  ClockworkCalcTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/EngineTests.swift, Tests/ModelTests.swift, Tests/CASTests.swift, Tests/NotationTests.swift, Tests/ProgrammerTests.swift, Tests/QuickCalcTests.swift, Tests/GraphTests.swift, Tests/ExpressionEditorTests.swift]
    dependencies: [{target: ClockworkCalc}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ClockworkCalcUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests.swift]
    dependencies: [{target: ClockworkCalc}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClockworkCalc:
    build:
      targets:
        ClockworkCalc: all
    test:
      targets: [ClockworkCalcTests, ClockworkCalcUITests]
