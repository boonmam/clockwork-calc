<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
<link rel="stylesheet" href="katex.min.css"><script src="katex.min.js"></script>
<style>
:root { color-scheme: light dark; } body { margin: 0; padding: 20px 12px; color: #152b29; background: transparent; font: 17px -apple-system; }
.label { font: 11px -apple-system; text-transform: uppercase; letter-spacing: 1.6px; opacity: .55; margin-bottom: 14px; }
.math { overflow-x: auto; overflow-y: hidden; padding: 8px 0 20px; }
#result { font-size: 1.35em; color: #087f70; } .katex-display { margin: 0; text-align: left; }
@media(prefers-color-scheme:dark) { body { color: #e8f4f2; } #result { color: #7ce4cf; } }
</style></head><body>
<div class="label">Expression</div><div id="input" class="math"></div>
<div class="label" id="resultLabel">Result</div><div id="result" class="math"></div>
<script>
window.showCalculation = function(input, result, approximate) {
  for (const [id, value] of [['input', input], ['result', result]]) {
    const element = document.getElementById(id);
    try { katex.render(value, element, {displayMode:true, throwOnError:false, trust:false, strict:'ignore', maxExpand:1000}); }
    catch (_) { element.textContent = value; }
  }
  document.getElementById('resultLabel').textContent = approximate ? 'Approximate result' : 'Result';
};
</script></body></html>
